<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Odds Drill — American, Decimal &amp; Implied Probability Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board-bg: #0a1420;
    --panel: #101f30;
    --panel-raised: #16283c;
    --paper: #ece4d3;
    --amber: #ffb020;
    --amber-strong: #ffc659;
    --cyan: #45d4ff;
    --violet: #b98cff;
    --green: #2fe88a;
    --red: #ff4d5e;
    --slate: #6b7c92;
    --slate-dim: #24384f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
  }

  body {
    background: var(--board-bg);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -10%;
    background: radial-gradient(circle at 50% 22%, rgba(255,176,32,0.10), transparent 55%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      180deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .ticket {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border-radius: 20px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
    overflow: hidden;
  }

  .ticket-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand-mark {
    color: var(--amber);
    font-size: 1rem;
    line-height: 1;
  }

  .brand h1 {
    margin: 0;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.14em;
  }

  .head-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .scoreboard {
    display: flex;
    gap: 18px;
  }

  .reset-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--slate-dim);
    background: transparent;
    color: var(--slate);
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, transform 0.2s ease;
  }

  .reset-btn:hover {
    border-color: var(--red);
    color: var(--red);
    transform: rotate(-70deg);
  }

  .reset-btn:active {
    transform: rotate(-140deg) scale(0.92);
  }

  .reset-btn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.3;
  }

  .stat-label {
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--paper);
  }

  .perf {
    height: 18px;
    background-color: var(--panel);
    background-image: radial-gradient(circle 6px, var(--board-bg) 99%, transparent 100%);
    background-repeat: repeat-x;
    background-position: 6px center;
    background-size: 24px 18px;
  }

  .ticket-body {
    position: relative;
    padding: 30px 26px 28px;
  }

  .given-block {
    position: relative;
    text-align: center;
    padding-bottom: 6px;
  }

  .chip {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .chip-given {
    color: var(--amber);
    border: 1px solid rgba(255,176,32,0.35);
    border-radius: 999px;
    padding: 5px 14px;
    background: rgba(255,176,32,0.08);
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .given-value {
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(2.5rem, 10vw, 3.6rem);
    color: var(--amber);
    text-shadow: 0 0 14px rgba(255,176,32,0.5), 0 0 40px rgba(255,176,32,0.2);
    letter-spacing: 0.01em;
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }

  .given-block[data-format="decimal"] .chip-given {
    color: var(--cyan);
    border-color: rgba(69,212,255,0.35);
    background: rgba(69,212,255,0.08);
  }

  .given-block[data-format="decimal"] .given-value {
    color: var(--cyan);
    text-shadow: 0 0 14px rgba(69,212,255,0.5), 0 0 40px rgba(69,212,255,0.2);
  }

  .given-block[data-format="probability"] .chip-given {
    color: var(--violet);
    border-color: rgba(185,140,255,0.35);
    background: rgba(185,140,255,0.08);
  }

  .given-block[data-format="probability"] .given-value {
    color: var(--violet);
    text-shadow: 0 0 14px rgba(185,140,255,0.5), 0 0 40px rgba(185,140,255,0.2);
  }

  .given-suffix {
    font-size: 0.42em;
    color: var(--slate);
    margin-left: 4px;
    font-weight: 600;
  }

  .convert-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 22px 0 18px;
    color: var(--slate);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .convert-divider::before,
  .convert-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--slate-dim);
  }

  .answer-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field label {
    display: block;
    margin-bottom: 7px;
  }

  .input-shell {
    display: flex;
    align-items: center;
    background: var(--panel-raised);
    border: 1.5px solid var(--slate-dim);
    border-radius: 10px;
    padding: 0 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-shell:focus-within {
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(255,176,32,0.14);
  }

  .input-shell.correct {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47,232,138,0.12);
  }

  .input-shell.incorrect {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(255,77,94,0.12);
  }

  .input-shell input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 13px 4px;
    width: 100%;
    min-width: 0;
  }

  .input-shell input::placeholder {
    color: var(--slate);
    opacity: 0.7;
    font-weight: 500;
  }

  .input-shell input[readonly] {
    opacity: 0.75;
  }

  .suffix {
    font-family: 'JetBrains Mono', monospace;
    color: var(--slate);
    font-size: 0.95rem;
    font-weight: 600;
  }

  .field-result {
    min-height: 1.15em;
    margin-top: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .field-result.correct { color: var(--green); }
  .field-result.incorrect { color: var(--red); }

  .action-btn {
    margin-top: 6px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--amber);
    color: #201603;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 0 #9c6a12, 0 10px 20px -6px rgba(255,176,32,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .action-btn:hover { background: var(--amber-strong); }

  .action-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #9c6a12, 0 4px 10px -4px rgba(255,176,32,0.3);
  }

  .action-btn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 3px;
  }

  .action-btn.next {
    background: transparent;
    color: var(--paper);
    border: 1.5px solid var(--slate-dim);
    box-shadow: none;
  }

  .action-btn.next:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  .action-btn.next:active {
    transform: translateY(2px);
  }

  .hint {
    margin: 10px 0 0;
    text-align: center;
    font-size: 0.7rem;
    color: var(--slate);
  }

  .hint kbd {
    font-family: 'JetBrains Mono', monospace;
    background: var(--panel-raised);
    border: 1px solid var(--slate-dim);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--paper);
  }

  .stamp {
    position: absolute;
    top: -6px;
    right: 6px;
    border: 3px solid currentColor;
    border-radius: 8px;
    padding: 4px 14px;
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    transform: rotate(-10deg) scale(1.5);
    pointer-events: none;
  }

  .stamp.hit { color: var(--green); }
  .stamp.miss { color: var(--red); }

  .stamp.show {
    animation: stampIn 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
  }

  @keyframes stampIn {
    0% { opacity: 0; transform: rotate(-10deg) scale(2); }
    55% { opacity: 1; transform: rotate(-7deg) scale(0.9); }
    100% { opacity: 1; transform: rotate(-8deg) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stamp.show { animation: none; opacity: 1; transform: rotate(-8deg) scale(1); }
    .action-btn:active { transform: none; }
    .action-btn { transition: none; }
  }

  @media (max-width: 420px) {
    .ticket-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .head-right { align-self: stretch; justify-content: space-between; }
    .scoreboard { flex: 1; justify-content: space-between; }
    .stat { align-items: flex-start; }
  }
</style>
</head>
<body>
  <main class="ticket" id="ticket">
    <header class="ticket-head">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <h1>Odds Drill</h1>
      </div>
      <div class="head-right">
        <div class="scoreboard">
          <div class="stat">
            <span class="stat-label">Streak</span>
            <span class="stat-value" id="streakValue">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Record</span>
            <span class="stat-value" id="recordValue">0/0</span>
          </div>
        </div>
        <button type="button" class="reset-btn" id="resetBtn" title="Reset streak &amp; record" aria-label="Reset streak and record">&#8634;</button>
      </div>
    </header>

    <div class="perf" aria-hidden="true"></div>

    <section class="ticket-body">
      <div class="stamp" id="stamp" aria-hidden="true">HIT</div>

      <div class="given-block" id="givenBlock" data-format="american">
        <span class="chip chip-given" id="givenLabel">American Odds</span>
        <div class="given-value" id="givenValue">+150</div>
      </div>

      <div class="convert-divider"><span>Convert to</span></div>

      <form class="answer-form" id="answerForm" autocomplete="off" novalidate>
        <div class="field" id="field1">
          <label class="chip" id="field1Label" for="input1">Decimal Odds</label>
          <div class="input-shell" id="field1Shell">
            <input type="text" inputmode="decimal" id="input1" placeholder="e.g. 2.50" />
            <span class="suffix" id="field1Suffix"></span>
          </div>
          <div class="field-result" id="field1Result"></div>
        </div>

        <div class="field" id="field2">
          <label class="chip" id="field2Label" for="input2">Implied Probability</label>
          <div class="input-shell" id="field2Shell">
            <input type="text" inputmode="decimal" id="input2" placeholder="e.g. 40.0" />
            <span class="suffix" id="field2Suffix">%</span>
          </div>
          <div class="field-result" id="field2Result"></div>
        </div>

        <button type="submit" class="action-btn" id="actionBtn">Lock In Pick</button>
        <p class="hint">press <kbd>Enter</kbd> to submit</p>
      </form>
    </section>
  </main>

<script>
(function () {
  'use strict';

  var LABELS = { american: 'American Odds', decimal: 'Decimal Odds', probability: 'Implied Probability' };
  var SUFFIX = { american: '', decimal: '', probability: '%' };
  var PLACEHOLDER = { american: 'e.g. +150', decimal: 'e.g. 2.50', probability: 'e.g. 40.0' };
  var TOLERANCE = { american: 2, decimal: 0.02, probability: 0.3 };
  var STORAGE_KEY = 'oddsDrillStats.v1';

  var els = {
    givenBlock: document.getElementById('givenBlock'),
    givenLabel: document.getElementById('givenLabel'),
    givenValue: document.getElementById('givenValue'),
    form: document.getElementById('answerForm'),
    field1Label: document.getElementById('field1Label'),
    field1Shell: document.getElementById('field1Shell'),
    field1Suffix: document.getElementById('field1Suffix'),
    field1Result: document.getElementById('field1Result'),
    input1: document.getElementById('input1'),
    field2Label: document.getElementById('field2Label'),
    field2Shell: document.getElementById('field2Shell'),
    field2Suffix: document.getElementById('field2Suffix'),
    field2Result: document.getElementById('field2Result'),
    input2: document.getElementById('input2'),
    actionBtn: document.getElementById('actionBtn'),
    stamp: document.getElementById('stamp'),
    streakValue: document.getElementById('streakValue'),
    recordValue: document.getElementById('recordValue'),
    resetBtn: document.getElementById('resetBtn')
  };

  var stats = loadStats();
  var givenFormat = null;
  var givenValue = null;
  var targets = null;
  var answerFormats = null;
  var submitted = false;

  function americanToDecimal(american) {
    return american > 0 ? (american / 100 + 1) : (100 / Math.abs(american) + 1);
  }

  function decimalToAmerican(decimal) {
    return decimal >= 2 ? (decimal - 1) * 100 : -100 / (decimal - 1);
  }

  function decimalToProbability(decimal) { return 1 / decimal; }
  function probabilityToDecimal(probability) { return 1 / probability; }

  function toDecimal(format, value) {
    if (format === 'decimal') return value;
    if (format === 'american') return americanToDecimal(value);
    return probabilityToDecimal(value);
  }

  function fromDecimal(format, decimalValue) {
    if (format === 'decimal') return decimalValue;
    if (format === 'american') return decimalToAmerican(decimalValue);
    return decimalToProbability(decimalValue);
  }

  function convert(fromFormat, toFormat, value) {
    return fromDecimal(toFormat, toDecimal(fromFormat, value));
  }

  function loadStats() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { correct: 0, total: 0, streak: 0 };
  }

  function saveStats() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  function updateScoreboard() {
    els.streakValue.textContent = String(stats.streak);
    els.recordValue.textContent = stats.correct + '/' + stats.total;
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function displayString(format, value) {
    if (format === 'american') {
      return { main: (value > 0 ? '+' : '') + value, suffix: '' };
    }
    if (format === 'decimal') {
      return { main: value.toFixed(2), suffix: '×' };
    }
    return { main: (value * 100).toFixed(1), suffix: '%' };
  }

  function correctValue(format) {
    if (format === 'american') return Math.round(targets[format]);
    if (format === 'decimal') return parseFloat(targets[format].toFixed(2));
    return parseFloat((targets[format] * 100).toFixed(1));
  }

  function correctDisplay(format) {
    if (format === 'american') {
      var v = correctValue(format);
      return (v > 0 ? '+' : '') + v;
    }
    if (format === 'decimal') return correctValue(format).toFixed(2);
    return correctValue(format).toFixed(1) + '%';
  }

  function newQuestion() {
    var isPositive = Math.random() < 0.5;
    var magnitude = Math.round(randomInt(100, 700) / 5) * 5;
    var seedAmerican = isPositive ? magnitude : -magnitude;

    var formats = ['american', 'decimal', 'probability'];
    givenFormat = formats[randomInt(0, 2)];
    answerFormats = formats.filter(function (f) { return f !== givenFormat; });

    // The given value is rounded to whatever precision is actually shown on
    // screen, and every answer is derived FROM that rounded value below —
    // never from the unrounded seed — so a correct manual conversion of what
    // the player sees always lands on the accepted answer.
    if (givenFormat === 'american') {
      givenValue = seedAmerican;
    } else if (givenFormat === 'decimal') {
      givenValue = parseFloat(americanToDecimal(seedAmerican).toFixed(2));
    } else {
      var seedProbabilityPct = decimalToProbability(americanToDecimal(seedAmerican)) * 100;
      givenValue = parseFloat(seedProbabilityPct.toFixed(1)) / 100;
    }

    targets = {};
    answerFormats.forEach(function (f) {
      targets[f] = convert(givenFormat, f, givenValue);
    });

    var given = displayString(givenFormat, givenValue);
    els.givenBlock.setAttribute('data-format', givenFormat);
    els.givenLabel.textContent = LABELS[givenFormat];
    els.givenValue.innerHTML = given.main + (given.suffix ? '<span class="given-suffix">' + given.suffix + '</span>' : '');

    setupField(answerFormats[0], els.field1Label, els.field1Shell, els.field1Suffix, els.input1, els.field1Result);
    setupField(answerFormats[1], els.field2Label, els.field2Shell, els.field2Suffix, els.input2, els.field2Result);

    els.actionBtn.textContent = 'Lock In Pick';
    els.actionBtn.classList.remove('next');
    els.stamp.classList.remove('show', 'hit', 'miss');
    submitted = false;

    els.input1.focus();
  }

  function setupField(format, labelEl, shellEl, suffixEl, inputEl, resultEl) {
    labelEl.textContent = LABELS[format];
    labelEl.setAttribute('for', inputEl.id);
    suffixEl.textContent = SUFFIX[format];
    inputEl.placeholder = PLACEHOLDER[format];
    inputEl.value = '';
    inputEl.readOnly = false;
    shellEl.classList.remove('correct', 'incorrect');
    resultEl.textContent = '';
    resultEl.classList.remove('correct', 'incorrect');
    inputEl.dataset.format = format;
  }

  function evaluateField(format, inputEl, shellEl, resultEl) {
    var userVal = parseFloat(inputEl.value);
    var target = correctValue(format);
    var isCorrect = !isNaN(userVal) && Math.abs(userVal - target) <= TOLERANCE[format];

    shellEl.classList.add(isCorrect ? 'correct' : 'incorrect');
    resultEl.classList.add(isCorrect ? 'correct' : 'incorrect');
    resultEl.textContent = isCorrect ? '✓ correct' : '✗ answer: ' + correctDisplay(format);
    inputEl.readOnly = true;

    return isCorrect;
  }

  function handleSubmit(e) {
    e.preventDefault();

    if (!submitted) {
      var correct1 = evaluateField(answerFormats[0], els.input1, els.field1Shell, els.field1Result);
      var correct2 = evaluateField(answerFormats[1], els.input2, els.field2Shell, els.field2Result);
      var bothCorrect = correct1 && correct2;

      els.stamp.textContent = bothCorrect ? 'Hit' : 'Miss';
      els.stamp.classList.add('show', bothCorrect ? 'hit' : 'miss');

      stats.total += 1;
      if (bothCorrect) {
        stats.correct += 1;
        stats.streak += 1;
      } else {
        stats.streak = 0;
      }
      saveStats();
      updateScoreboard();

      els.actionBtn.textContent = 'Next Round →';
      els.actionBtn.classList.add('next');
      submitted = true;
    } else {
      newQuestion();
    }
  }

  function handleReset() {
    if (!window.confirm('Reset streak and record to 0?')) return;
    stats = { correct: 0, total: 0, streak: 0 };
    saveStats();
    updateScoreboard();
  }

  els.form.addEventListener('submit', handleSubmit);
  els.resetBtn.addEventListener('click', handleReset);

  updateScoreboard();
  newQuestion();
})();
</script>
</body>
</html>
